stages:
  - analyze
  - test
  - release
  - changelog

analyze:
  stage: analyze
  image: cirrusci/flutter:stable
  script:
    - flutter doctor
    - flutter pub get
    - dart --version
    - dart analyze --fatal-infos --fatal-warnings
  only:
    - main
    - merge_requests

test:
  stage: test
  image: cirrusci/flutter:stable
  script:
    - flutter pub get
    - flutter test
  only:
    - main
    - merge_requests

release:
  stage: release
  image: cirrusci/flutter:stable
  script:
    - |
      tag_name="${CI_COMMIT_TAG}"
      if [[ -z "$tag_name" ]]; then
        echo "Release tag_name missing" >&2
        exit 1
      fi
      version="${tag_name#v}"
      echo "Setting pubspec.yaml version to $version"
      cp pubspec.yaml pubspec.yaml.bak
      awk -v ver="$version" '
        BEGIN{updated=0}
        /^version:\s*/{print "version: " ver; updated=1; next}
        {print}
        END{if(updated==0){print "version: " ver}}'
        pubspec.yaml.bak > pubspec.yaml
      rm -f pubspec.yaml.bak
    - flutter pub get
    - flutter pub publish --dry-run
    - flutter pub publish --force
  only:
    - tags

changelog:
  stage: changelog
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - apk add --no-cache bash
  script:
    - |
      git config --global user.email "gitlab-ci@example.com"
      git config --global user.name "GitLab CI"
    - git cliff --config cliff.toml --output CHANGELOG.md --tag-pattern '^v?\d+\.\d+\.\d+$' --no-exec
    - |
      git add CHANGELOG.md
      git commit -m "chore(changelog): update CHANGELOG.md"
    - git push origin HEAD
  only:
    - schedules
    - manual